<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Management Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 Project Management Dashboard</h1>
        </header>

        <!-- Stats Cards -->
        <div class="stats-container">
            <div class="stat-card">
                <div class="stat-number" id="totalProjects">0</div>
                <div class="stat-label">Total Projects</div>
            </div>
            <div class="stat-card completed">
                <div class="stat-number" id="completedProjects">0</div>
                <div class="stat-label">Completed</div>
            </div>
            <div class="stat-card cancelled">
                <div class="stat-number" id="cancelledProjects">0</div>
                <div class="stat-label">Cancelled</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="avgScore">0%</div>
                <div class="stat-label">Avg Customer %</div>
            </div>
        </div>

        <!-- Add New Project Button -->
        <button class="btn-add" onclick="openModal()">+ Tambah Project Baru</button>

        <!-- Data Table -->
        <div class="table-container">
            <table id="projectTable">
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Customer Name</th>
                        <th>PMO</th>
                        <th>RM Ticket / DQ Funnel</th>
                        <th>Complete Date</th>
                        <th>Project Tier</th>
                        <th>Project Name</th>
                        <th>Tech %</th>
                        <th>Cust %</th>
                        <th>Time %</th>
                        <th>Total Cust %</th>
                        <th>Avg Bar %</th>
                        <th>Engineer 1</th>
                        <th>Engineer 2</th>
                        <th>Link</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- Modal Form -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle">Tambah Project Baru</h2>
            <form id="projectForm">
                <input type="hidden" id="editIndex" value="-1">
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Customer Name *</label>
                        <input type="text" id="custName" required>
                    </div>
                    <div class="form-group">
                        <label>PMO Status *</label>
                        <select id="pmo" required>
                            <option value="">Pilih Status</option>
                            <option value="Completed">Completed</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Cancelled">Cancelled</option>
                            <option value="On Hold">On Hold</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>RM Ticket / DQ Funnel</label>
                        <input type="text" id="rmTicket" placeholder="e.g. 5101 / 651870">
                    </div>
                    <div class="form-group">
                        <label>Complete Date</label>
                        <input type="date" id="completeDate">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Project Tier</label>
                        <select id="projectTier">
                            <option value="☆☆☆☆☆">☆☆☆☆☆ (5 Star)</option>
                            <option value="☆☆☆☆">☆☆☆☆ (4 Star)</option>
                            <option value="☆☆☆">☆☆☆ (3 Star)</option>
                            <option value="☆☆">☆☆ (2 Star)</option>
                            <option value="☆">☆ (1 Star)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Project Name *</label>
                        <input type="text" id="projectName" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Tech Point (%)</label>
                        <input type="number" id="techPoint" min="0" max="100" placeholder="0-100">
                    </div>
                    <div class="form-group">
                        <label>Customer Point (%)</label>
                        <input type="number" id="custPoint" min="0" max="100" placeholder="0-100">
                    </div>
                    <div class="form-group">
                        <label>Time Point (%)</label>
                        <input type="number" id="timePoint" min="0" max="100" placeholder="0-100">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Total Customer %</label>
                        <input type="number" id="totalCust" min="0" max="100" placeholder="0-100">
                    </div>
                    <div class="form-group">
                        <label>Project Average Bar %</label>
                        <input type="number" id="avgBar" min="0" max="100" placeholder="0-100">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Engineer 1</label>
                        <input type="text" id="engineer1">
                    </div>
                    <div class="form-group">
                        <label>Engineer 2</label>
                        <input type="text" id="engineer2">
                    </div>
                </div>

                <div class="form-group full-width">
                    <label>Link NextCloud / GDrive</label>
                    <input type="url" id="link" placeholder="https://...">
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-cancel" onclick="closeModal()">Batal</button>
                    <button type="submit" class="btn-submit">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
