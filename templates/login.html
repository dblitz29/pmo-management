<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Project Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { dark: { 700: '#252542', 800: '#1a1a2e', 900: '#0f0f1a' } } } }
        }
    </script>
</head>
<body class="bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white dark:bg-dark-800 rounded-2xl shadow-2xl w-full max-w-md p-8">
        <div class="text-center mb-8">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white text-3xl mx-auto mb-4">📊</div>
            <h1 class="text-2xl font-bold text-gray-800 dark:text-white">Project Dashboard</h1>
            <p class="text-gray-500 dark:text-gray-400 mt-2">Sign in to your account</p>
        </div>

        <form id="loginForm">
            <div class="mb-4">
                <label class="block text-sm text-gray-600 dark:text-gray-400 mb-2">Username</label>
                <input type="text" id="username" required 
                    class="w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-dark-700 text-gray-800 dark:text-white focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition"
                    placeholder="Enter username">
            </div>
            <div class="mb-6">
                <label class="block text-sm text-gray-600 dark:text-gray-400 mb-2">Password</label>
                <input type="password" id="password" required 
                    class="w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-dark-700 text-gray-800 dark:text-white focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition"
                    placeholder="Enter password">
            </div>

            <div id="error" class="hidden mb-4 p-3 rounded-xl bg-red-100 text-red-700 text-sm"></div>

            <button type="submit" 
                class="w-full py-3 bg-gradient-to-r from-indigo-500 to-purple-600 text-white rounded-xl font-medium hover:opacity-90 transition shadow-lg shadow-indigo-500/30">
                Sign In
            </button>
        </form>

        <div class="mt-8 p-4 bg-gray-50 dark:bg-dark-700 rounded-xl">
            <p class="text-xs text-gray-500 dark:text-gray-400 mb-2">Demo accounts:</p>
            <div class="text-xs text-gray-600 dark:text-gray-300 space-y-1">
                <p><span class="font-medium">Admin:</span> admin / admin123</p>
                <p><span class="font-medium">Viewer:</span> viewer / viewer123</p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const error = document.getElementById('error');
            error.classList.add('hidden');

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value
                    })
                });

                const data = await res.json();
                if (res.ok) {
                    window.location.href = '/';
                } else {
                    error.textContent = data.error || 'Login failed';
                    error.classList.remove('hidden');
                }
            } catch (err) {
                error.textContent = 'Connection error';
                error.classList.remove('hidden');
            }
        };
    </script>
</body>
</html>
